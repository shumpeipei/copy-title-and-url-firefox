name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-ext
        run: npm install --no-save web-ext

      - name: Lint add-on
        run: npx web-ext lint

      - name: Build add-on package
        run: npx web-ext build --overwrite-dest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-ext-artifact
          path: web-ext-artifacts/*.zip
